# .github/workflows/main.yml

name: CMake CI for Linux GCC with dependencies

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      CC: gcc-13
      CXX: g++-13

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          submodules: 'recursive'
          lfs: true

    - name: Install GCC 13
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-13 g++-13

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "install-dir=${{ github.workspace }}/install" >> "$GITHUB_OUTPUT"
    
    - name: Set up test env
      run: |
        echo "LD_LIBRARY_PATH=${{ github.workspace }}/install/lib:\
        ${{ github.workspace }}/build/3rdparty/logger/x86_64/lib:\
        ${{ github.workspace }}/install/lib:\
        $LD_LIBRARY_PATH" >> $GITHUB_ENV

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_INSTALL_PREFIX=${{ steps.strings.outputs.install-dir }}
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_AI_PIPE_TESTS=ON
        -DBUILD_AI_PIPE_EXAMPLES=ON
        -DBUILD_AI_PIPE_BENCHMARKS=ON
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

    - name: Install project
      run: cmake --install ${{ steps.strings.outputs.build-output-dir }}

    - name: Run GTests
      working-directory: ${{ steps.strings.outputs.install-dir }}
      run: ./tests/ai_pipe_tests --gtest_filter=*.*

  sanitize:
    runs-on: ubuntu-24.04
    # TODO(P2.6): drop continue-on-error once TSan findings are fixed,
    # making sanitizers a required gate.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]

    env:
      CC: gcc-13
      CXX: g++-13
      ASAN_OPTIONS: detect_leaks=1
      TSAN_OPTIONS: second_deadlock_stack=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          submodules: 'recursive'
          lfs: true

    - name: Install GCC 13
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-13 g++-13

    # gcc-13 libtsan aborts with "unexpected memory mapping" on kernels
    # with 32-bit mmap ASLR entropy; reduce it for the TSan run.
    - name: Reduce ASLR entropy for ThreadSanitizer
      if: matrix.sanitizer == 'thread'
      run: sudo sysctl -w vm.mmap_rnd_bits=28

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DBUILD_AI_PIPE_TESTS=ON
        -DAI_PIPE_SANITIZER=${{ matrix.sanitizer }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build -j

    - name: Run GTests (${{ matrix.sanitizer }} sanitizer)
      working-directory: ${{ github.workspace }}/build
      run: |
        export LD_LIBRARY_PATH=${{ github.workspace }}/build/x86_64/lib:$LD_LIBRARY_PATH
        ./x86_64/bin/tests/ai_pipe_tests
