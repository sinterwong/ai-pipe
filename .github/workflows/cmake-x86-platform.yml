# .github/workflows/main.yml

name: CMake CI for Linux GCC with dependencies

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc-13, cxx: g++-13, packages: "gcc-13 g++-13" }
          - { cc: clang-18, cxx: clang++-18, packages: "clang-18" }

    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          submodules: 'recursive'
          lfs: true

    - name: Install compiler
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.compiler.packages }}

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "install-dir=${{ github.workspace }}/install" >> "$GITHUB_OUTPUT"
    
    - name: Set up test env
      run: |
        echo "LD_LIBRARY_PATH=${{ github.workspace }}/install/lib:\
        $LD_LIBRARY_PATH" >> $GITHUB_ENV

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_INSTALL_PREFIX=${{ steps.strings.outputs.install-dir }}
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_AI_PIPE_TESTS=ON
        -DBUILD_AI_PIPE_EXAMPLES=ON
        -DBUILD_AI_PIPE_BENCHMARKS=ON
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

    - name: Install project
      run: cmake --install ${{ steps.strings.outputs.build-output-dir }}

    - name: Run GTests
      working-directory: ${{ steps.strings.outputs.install-dir }}
      run: ./tests/ai_pipe_tests --gtest_filter=*.*

  sanitize:
    runs-on: ubuntu-24.04
    # Required gate since P2.6: ASan and TSan both run clean.
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]

    env:
      CC: gcc-13
      CXX: g++-13
      ASAN_OPTIONS: detect_leaks=1
      TSAN_OPTIONS: second_deadlock_stack=1
      UBSAN_OPTIONS: print_stacktrace=1

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          submodules: 'recursive'
          lfs: true

    - name: Install GCC 13
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-13 g++-13

    # gcc-13 libtsan aborts with "unexpected memory mapping" on kernels
    # with 32-bit mmap ASLR entropy; reduce it for the TSan run.
    - name: Reduce ASLR entropy for ThreadSanitizer
      if: matrix.sanitizer == 'thread'
      run: sudo sysctl -w vm.mmap_rnd_bits=28

    - name: Configure CMake
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DBUILD_AI_PIPE_TESTS=ON
        -DAI_PIPE_SANITIZER=${{ matrix.sanitizer }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ github.workspace }}/build -j

    - name: Run GTests (${{ matrix.sanitizer }} sanitizer)
      working-directory: ${{ github.workspace }}/build
      run: |
        export LD_LIBRARY_PATH=${{ github.workspace }}/build/x86_64/lib:$LD_LIBRARY_PATH
        ./x86_64/bin/tests/ai_pipe_tests

  build-static:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          submodules: 'recursive'
          lfs: true
    - name: Install GCC 13
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-13 g++-13
    - name: Configure (static, warnings as errors)
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_SHARED_LIBS=OFF
        -DAI_PIPE_WERROR=ON
        -DBUILD_AI_PIPE_TESTS=ON
        -S ${{ github.workspace }}
    - name: Build
      run: cmake --build ${{ github.workspace }}/build -j
    - name: Run GTests
      working-directory: ${{ github.workspace }}/build
      run: ./x86_64/bin/tests/ai_pipe_tests

  lint:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Pin the exact formatter version used for the one-time normalization
    # (P6.4) so gate results do not drift across toolchain releases.
    - name: Install clang-format
      run: pip install clang-format==22.1.5

    - name: Check formatting
      run: |
        clang-format --dry-run --Werror \
          src/*.cpp src/*.hpp src/api/ai_pipe/*.hpp \
          tests/*.cpp tests/*.hpp \
          benchmarks/*.cpp benchmarks/*.hpp \
          examples/*.cpp

  clang-tidy:
    runs-on: ubuntu-24.04
    # Advisory for now: promote to a required gate once the existing
    # findings are triaged.
    continue-on-error: true
    env:
      CC: clang-18
      CXX: clang++-18
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          submodules: 'recursive'
    - name: Install tooling
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-18 clang-tidy-18
    - name: Configure (compile database)
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=Debug
        -DBUILD_AI_PIPE_TESTS=ON
        -S ${{ github.workspace }}
    - name: Run clang-tidy on library sources
      run: |
        clang-tidy-18 -p ${{ github.workspace }}/build src/*.cpp

  benchmark-gate:
    runs-on: ubuntu-24.04
    env:
      CC: gcc-13
      CXX: g++-13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
          submodules: 'recursive'
          lfs: true
    - name: Install GCC 13
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-13 g++-13
    - name: Configure (Release + benchmarks)
      run: >
        cmake -B ${{ github.workspace }}/build
        -DCMAKE_BUILD_TYPE=Release
        -DBUILD_AI_PIPE_BENCHMARKS=ON
        -S ${{ github.workspace }}
    - name: Build
      run: cmake --build ${{ github.workspace }}/build -j
    # Structural regression assertions only (relative, same-run, same
    # machine): catches O(1) paths degrading to O(N) and construction
    # going quadratic without flaking on shared-runner noise.
    - name: Run benchmark regression gate
      working-directory: ${{ github.workspace }}/build
      run: |
        export LD_LIBRARY_PATH=$PWD/x86_64/lib:$LD_LIBRARY_PATH
        python3 ${{ github.workspace }}/scripts/check_benchmarks.py \
          ./x86_64/bin/benchmarks/ai_pipe_benchmarks
